<style>
  :root { --d1:#fde2d2; --d2:#c9ede2; --d3:#fdf3c4; --d4:#e6d6f5; --ink:#222; --muted:#666; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:var(--ink); background:#fafafa; }
  header { text-align:center; padding:16px 12px 8px; }

  #planb { margin:14px 0; background:#fff; border-radius:12px; padding:10px 14px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
  #planb summary { cursor:pointer; font-weight:700; }
  #planb .warn { color:#c0392b; font-size:.85rem; margin:6px 0; }
  #planb .alt { display:grid; grid-template-columns:1fr auto; gap:6px 10px; padding:8px 0; border-top:1px solid #eee; font-size:.9rem; align-items:center; }
  #planb .alt small { color:var(--muted); display:block; }
  #planb .alt a { font-size:.8rem; text-decoration:none; background:#f0f0f0; border-radius:6px; padding:3px 7px; color:#222; margin-left:4px; white-space:nowrap; }
  .tabs button.all { flex:0 0 auto; background:#e5e5e5; }
  .links { display:flex; gap:8px; justify-content:center; margin:6px 0 0; }
  .links a { display:inline-block; padding:8px 14px; border-radius:20px; background:#1dc16a; color:#fff; font-weight:700; text-decoration:none; font-size:.9rem; }
  #install { display:none; margin:8px auto 0; font-size:.8rem; color:var(--muted); text-align:center; }
  .pin.home { width:32px; height:32px; line-height:28px; font-size:1.1rem; border-color:#c0392b; }
  .pin { background:#fff; border:2px solid #333; border-radius:50%; width:26px; height:26px; line-height:22px; text-align:center; font-weight:700; font-size:.8rem; }
</style>

<header><h1>🍊 2026 제주도 가족여행</h1><div class="clock" id="clock"></div><div class="links"><a id="bandLink" href="https://band.us/band/67749007" target="_blank">📷 가족 밴드 (사진)</a></div><div id="install">📱 홈 화면에 추가: iPhone은 공유 → "홈 화면에 추가", Android는 메뉴 → "홈 화면에 추가"</div></header>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ===== 일정 데이터 (여기만 고치면 됨) =====
// lat/lng 없으면 지도엔 안 찍히고 목록에만 나옴. ?: 대략적인 위치 → 확인 필요.
const HOME = { n:'숙소 패밀리가든빌리지', lat:33.4845, lng:126.4212, tel:'070-4468-1612', addr:'제주시 우령서로16길 54-22' };
const DAYS = [
 { date:'2026-09-07', label:'9/7 (월)', color:'var(--d1)', events:[
  { s:'',      e:'06:30', n:'김포공항 집결' },
  { s:'07:50', e:'09:00', n:'제주공항', lat:33.5066, lng:126.4929 },
  { s:'09:00', e:'09:30', n:'렌트카' },
  { s:'10:00', e:'11:00', n:'섬누들 (아침식사)', tel:'0507-1351-0649', m:'제주시 연동 1934-3 · 고사리육개장 10,000 / 고기국수 11,000 / 돌문어기름국수 14,000', lat:33.4880, lng:126.4930, q:1 },
  { s:'11:40', e:'12:10', n:'한담해안 산책로', lat:33.4611, lng:126.3090 },
  { s:'12:40', e:'14:10', n:'애월 랜디스도넛', tel:'064-799-0610', lat:33.4626, lng:126.3103, q:1 },
  { s:'12:40', e:'14:10', n:'도치돌 알파카 목장', tel:'064-799-6690', m:'애월읍 도치돌길 303 · 1시간30분 · 입장료 15,000', lat:33.4180, lng:126.3950, q:1 },
  { s:'14:30', e:'15:30', n:'은혜전복 (점심식사)', tel:'0507-1432-9060', m:'애월읍 애월로1길 24-3 · 전복돌솥밥·전복뚝배기·전복물회 17,000', lat:33.4795, lng:126.4090, q:1 },
  { s:'16:00', e:'16:00', n:'체크인', home:1 },
  { s:'16:00', e:'18:00', n:'숙소 (수영)', m:'숙소 풀장에서 물놀이', home:1 },
  { s:'16:00', e:'18:00', n:'하귀농협하나로마트', m:'저녁 장보기', lat:33.4770, lng:126.4045, q:1 },
  { s:'18:00', e:'20:00', n:'바베큐 (저녁식사)', home:1, m:'숯·그릴 사용료 4인 4만원 / 추가 1인 5천원' },
 ]},
 { date:'2026-09-08', label:'9/8 (화)', color:'var(--d2)', events:[
  { s:'09:30', e:'10:00', n:'숙소 출발', home:1 },
  { s:'10:00', e:'12:00', n:'아르떼 키즈카페', tel:'1899-5008', m:'아르떼뮤지엄 어림비로 478 · 2시간 · 30,000 / 보호자 12,000 · 선택관광(2그룹)', lat:33.4030, lng:126.3465, q:1 },
  { s:'10:00', e:'12:00', n:'곶자왈 도립공원', tel:'064-792-6047', m:'대정읍 에듀시티로 178 · 1시간 · 입장료 1,000 · 선택관광(2그룹)', lat:33.2920, lng:126.2844 },
  { s:'12:20', e:'13:30', n:'운정이네 중문본점 (점심식사)', tel:'0507-1350-3883', m:'서귀포시 중산간서로 726 · 순살갈치조림+전복돌솥밥+옥돔구이 25,000 (전복돌솥밥 15,000)', lat:33.2636, lng:126.4378 },
  { s:'14:00', e:'15:00', n:'천지연폭포', m:'40분 · 성인 2,000 / 소인 1,000', lat:33.2470, lng:126.5580 },
  { s:'15:30', e:'17:00', n:'매일올레시장', m:'구경하고 먹고 포장하기 / 달인수산 회포장(얼음포장 가능)', lat:33.2503, lng:126.5630 },
  { s:'17:00', e:'18:00', n:'숙소 (수영)', m:'숙소 풀장에서 짧은 물놀이', home:1 },
  { s:'19:00', e:'20:30', n:'회포장 (저녁식사)', home:1, m:'포장해 온 음식으로 저녁' },
 ]},
 { date:'2026-09-09', label:'9/9 (수)', color:'var(--d3)', events:[
  { s:'09:30', e:'10:00', n:'숙소 출발', home:1 },
  { s:'10:00', e:'12:00', n:'아침미소목장', tel:'064-727-2545', m:'제주시 첨단동길 160-20 · 2시간 · 입장료 없음, 체험비 발생', lat:33.4601, lng:126.5705 },
  { s:'12:30', e:'14:00', n:'고집돌우럭 함덕점 (점심식사)', tel:'0507-1353-6061', m:'조천읍 신북로 491-9 2층 · 산해진미 中 33,000', lat:33.5405, lng:126.6660, q:1 },
  { s:'12:30', e:'14:00', n:'선물고팡 기념품샵', lat:33.5420, lng:126.6680, q:1 },
  { s:'14:10', e:'14:40', n:'함덕 잠수함', tel:'064-783-1334', m:'조함해안로 378 · 30분 · 네이버 예약가 대인 28,000 / 소인 23,000 · 희망팀만', lat:33.5430, lng:126.6690, q:1 },
  { s:'14:10', e:'15:30', n:'함덕해수욕장, 델문도카페', tel:'064-702-0007', m:'델문도 조함해안로 519-10 · 나머지는 델문도', lat:33.5426, lng:126.6704 },
  { s:'15:50', e:'17:00', n:'제주레포츠랜드', tel:'064-784-8800', m:'조천읍 와흘상서2길 47 · 카트 1회 약 10분 · 단거리 25,000 / 장거리 35,000 (연이어 체험시 50%할인)', lat:33.4642, lng:126.6537, q:1 },
  { s:'17:00', e:'17:30', n:'숙소 (수영)', m:'숙소 풀장에서 짧은 물놀이', home:1 },
  { s:'18:30', e:'20:00', n:'김치찜 (저녁식사)', home:1, m:'돼지고기 김치찜으로 저녁' },
 ]},
 { date:'2026-09-10', label:'9/10 (목)', color:'var(--d4)', events:[
  { s:'08:30', e:'09:30', n:'진정성 / 새우리 포장', tel:'064-900-2527', m:'새우리 제주시 무근성7길 21 (김밥·튀김, 예약) / 진정성 종점 이호 서해안로 124 (밀크티, 064-747-7674) · 딱새우김밥 7,500 / 모듬튀김 6,500 / 골드 밀크티 8,500', lat:33.5146, lng:126.5205 },
  { s:'10:00', e:'10:20', n:'체크아웃', home:1 },
  { s:'10:20', e:'10:40', n:'도두동 무지개 해안도로', m:'단체사진', lat:33.5100, lng:126.4680 },
  { s:'10:50', e:'11:20', n:'렌트카 반납' },
  { s:'11:30', e:'12:30', n:'공항 - 면세', lat:33.5066, lng:126.4929 },
  { s:'13:15', e:'14:30', n:'서울로 출발' },
 ]},
];
// ===== 끝 =====

const KST = () => new Date(new Date().toLocaleString('en-US', {timeZone:'Asia/Seoul'}));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm  = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmt = ev => ev.s ? `${ev.s} ~ ${ev.e}` : `~ ${ev.e}`;

// 각 이벤트에 절대 시각 부여
const ALL = [];
DAYS.forEach((d,di) => d.events.forEach((ev,i) => {
  const s = ev.s || '00:00';
  ev.start = new Date(`${d.date}T${s}:00+09:00`); ev.end = new Date(`${d.date}T${ev.e}:00+09:00`);
  if (ev.end <= ev.start) ev.end = new Date(ev.start.getTime() + 30*60000);
  ev.di = di; ALL.push(ev);
}));

function status(now) {
  const cur = ALL.filter(e => e.start <= now && now < e.end);
  const next = ALL.filter(e => e.start > now).sort((a,b)=>a.start-b.start)[0];
  return { cur, next };
}

const $now = document.getElementById('now');
function renderNow() {
  const now = KST(); const {cur,next} = status(now);
  document.getElementById('clock').textContent = `${ymd(now)} ${hm(now)} (KST)`;
  const dayColor = cur[0] ? DAYS[cur[0].di].color : next ? DAYS[next.di].color : '#ddd';
  $now.style.borderLeftColor = dayColor;
  const line = e => `<div class="title">${e.n}</div><div class="time">${DAYS[e.di].label} ${fmt(e)}</div>${e.m?`<div class="note">${e.m}</div>`:''}`;
  if (cur.length) {
    $now.innerHTML = `<div class="label">NOW · 지금 하는 일정</div>` + cur.map(line).join('<hr style="border:0;border-top:1px solid #eee">')
      + (next ? `<div class="next">다음 → <b>${next.n}</b> ${DAYS[next.di].label} ${fmt(next)}</div>` : '');
  } else if (next) {
    const mins = Math.round((next.start-now)/60000), h = Math.floor(mins/60), m = mins%60;
    const left = mins > 1440 ? `D-${Math.ceil(mins/1440)}` : h ? `${h}시간 ${m}분 후` : `${m}분 후`;
    $now.innerHTML = `<div class="label">NEXT · ${left}</div>` + line(next);
  } else {
    $now.innerHTML = `<div class="label">여행 끝 🎉</div><div class="title">수고했어요!</div>`;
  }
  document.querySelectorAll('.ev').forEach((el,i) => {
    const e = ALL[i]; el.classList.toggle('past', e.end <= now); el.classList.toggle('now', cur.includes(e));
  });
}

// 지도
const map = L.map('map').setView([33.38, 126.53], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap'}).addTo(map);
const dayHex = ['#f28c5b','#3bb08f','#e0b93a','#9b6fd8'];
const dayLayers = DAYS.map(() => L.layerGroup());
const homeMarker = L.marker([HOME.lat, HOME.lng], {icon: L.divIcon({className:'', html:'<div class="pin home">🏠</div>', iconSize:[32,32], iconAnchor:[16,16]}), zIndexOffset:1000}).addTo(map)
  .bindPopup(`<b>🏠 ${HOME.n}</b><br><small>${HOME.addr}</small><div class="act"><a href="tel:${HOME.tel}">📞 ${HOME.tel}</a><a target="_blank" href="https://map.kakao.com/link/to/${encodeURIComponent(HOME.n)},${HOME.lat},${HOME.lng}">🚗 카카오내비</a><a href="nmap://route/car?dlat=${HOME.lat}&dlng=${HOME.lng}&dname=${encodeURIComponent(HOME.n)}&appname=fam-jeju-trip">🚗 네이버</a></div>`, {maxWidth:280});
DAYS.forEach((d,di) => { let k=0; const pts=[]; d.events.forEach(ev => {
  if (ev.home) { ev.lat = HOME.lat; ev.lng = HOME.lng; ev.marker = homeMarker; pts.push([HOME.lat, HOME.lng]); return; }
  if (ev.lat == null) return; k++; pts.push([ev.lat, ev.lng]);
  const icon = L.divIcon({className:'', html:`<div class="pin" style="border-color:${dayHex[di]};color:${dayHex[di]}">${k}</div>`, iconSize:[26,26], iconAnchor:[13,13]});
  ev.marker = L.marker([ev.lat, ev.lng], {icon}).addTo(dayLayers[di])
    .bindPopup(() => {
      const nm = ev.n.replace(/\s*\(.*\)/,'');
      const acts = [
        ev.tel ? `<a href="tel:${ev.tel}">📞 ${ev.tel}</a>` : '',
        `<a target="_blank" href="https://map.kakao.com/link/to/${encodeURIComponent(nm)},${ev.lat},${ev.lng}">🚗 카카오내비</a>`,
        `<a href="nmap://route/car?dlat=${ev.lat}&dlng=${ev.lng}&dname=${encodeURIComponent(nm)}&appname=fam-jeju-trip">🚗 네이버</a>`,
        `<a target="_blank" href="https://map.naver.com/p/search/${encodeURIComponent(nm)}">🔍 네이버지도</a>`,
      ].join('');
      return `<b>${ev.n}</b>${ev.q?' <small>(위치 대략)</small>':''}<br>${d.label} ${fmt(ev)}${ev.m?`<br><small>${ev.m}</small>`:''}<div class="act">${acts}</div>`;
    }, {maxWidth:280});
});
  // 동선: 같은 지점 연속 중복 제거 후 순서대로 연결
  const line = pts.filter((p,i) => !i || p[0]!==pts[i-1][0] || p[1]!==pts[i-1][1]);
  L.polyline(line, {color:dayHex[di], weight:3, opacity:.7, dashArray:'6 6'}).addTo(dayLayers[di]);
});
function showMapDay(di) { // di === -1 → 전체
  dayLayers.forEach((g,i) => (di===-1 || i===di) ? g.addTo(map) : map.removeLayer(g));
  const shown = di===-1 ? dayLayers : [dayLayers[di]];
  const b = L.featureGroup(shown.flatMap(g => g.getLayers())).getBounds();
  if (b.isValid()) map.fitBounds(b.pad(0.15));
}

// 탭 + 일정 목록
const $tabs = document.getElementById('tabs'), $days = document.getElementById('days');
DAYS.forEach((d,di) => {
  const b = document.createElement('button'); b.textContent = d.label; b.style.background = d.color;
  b.onclick = () => show(di); $tabs.appendChild(b);
  const sec = document.createElement('section'); sec.className = 'day';
  sec.innerHTML = d.events.map(ev => `<div class="ev" style="border-left:6px solid ${dayHex[di]}"><div class="t">${fmt(ev)}</div><div><div class="n">${ev.n}${ev.home?' 🏠':ev.lat!=null?' 📍':''}</div>${ev.m?`<div class="m">${ev.m}</div>`:''}</div></div>`).join('');
  $days.appendChild(sec);
});
// 클릭 → 지도 이동 (ALL 순서 = DOM 순서)
document.querySelectorAll('.ev').forEach((el,i) => el.onclick = () => { const e = ALL[i]; if (e.marker) { map.setView([e.lat,e.lng], 14); e.marker.openPopup(); window.scrollTo({top:0,behavior:'smooth'}); } });
const $all = document.createElement('button'); $all.textContent = '전체'; $all.className = 'all'; $all.onclick = () => { showMapDay(-1); $tabs.querySelectorAll('button').forEach(b=>b.classList.remove('on')); $all.classList.add('on'); }; $tabs.appendChild($all);
function show(di) {
  $tabs.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on', i===di));
  $days.querySelectorAll('.day').forEach((s,i)=>s.classList.toggle('on', i===di));
  showMapDay(di);
}
// 오늘 날짜의 탭 기본 선택, 아니면 첫날
const today = ymd(KST()); show(Math.max(0, DAYS.findIndex(d => d.date === today)));
renderNow(); setInterval(renderNow, 30000);

// ===== 플랜 B (실내 대체지) =====
const PLANB = [
 { n:'아르떼뮤지엄 제주', area:'애월(서쪽)', m:'미디어아트, 1.5시간. 아이도 좋아함', lat:33.4113, lng:126.3402 },
 { n:'제주항공우주박물관', area:'안덕(서남)', m:'실내 넓고 체험 많음, 아이 최적', lat:33.3128, lng:126.3005 },
 { n:'오설록 티뮤지엄 · 이니스프리하우스', area:'안덕(서남)', m:'실내 카페·전시, 곶자왈 근처', lat:33.3060, lng:126.2895 },
 { n:'넥슨컴퓨터박물관', area:'제주시 노형', m:'게임 체험, 초등 이상 강추', lat:33.4740, lng:126.4830 },
 { n:'국립제주박물관', area:'제주시 동쪽', m:'무료, 어린이박물관 있음', lat:33.5138, lng:126.5490 },
 { n:'제주해녀박물관', area:'구좌(동쪽)', m:'함덕에서 20분, 조용함', lat:33.5417, lng:126.8175 },
 { n:'아쿠아플라넷 제주', area:'성산(동쪽 끝)', m:'대형 아쿠아리움, 반나절 코스', lat:33.4326, lng:126.9270 },
 { n:'여미지식물원', area:'중문', m:'실내 온실, 운정이네·천지연 근처', lat:33.2517, lng:126.4160 },
 { n:'테디베어뮤지엄 제주', area:'중문', m:'아이 취향, 실내', lat:33.2450, lng:126.4120 },
];
document.getElementById('planbBody').innerHTML = `<div class="warn" id="planbWarn" style="display:none"></div>` + PLANB.map(p =>
  `<div class="alt"><div>${p.n} <small>${p.area} · ${p.m}</small></div><div><a target="_blank" href="https://map.kakao.com/link/to/${encodeURIComponent(p.n)},${p.lat},${p.lng}">🚗</a><a target="_blank" href="https://map.naver.com/p/search/${encodeURIComponent(p.n)}">🔍</a></div></div>`).join('');
function planBAlert(days) { // days: ['9/8 (화) 90%', ...]
  const w = document.getElementById('planbWarn'); if (!days.length) return;
  w.style.display = 'block'; w.textContent = '⚠️ 강수확률 70% 이상: ' + days.join(', ') + ' — 실내 대안 검토!';
  document.getElementById('planb').open = true;
}

// ===== 날씨 (Open-Meteo, 키 불필요) =====
(async () => {
  const $wx = document.getElementById('wx');
  const WMO = c => c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=49?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
  try {
    const u = 'https://api.open-meteo.com/v1/forecast?latitude=33.45&longitude=126.5&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=16';
    const r = await fetch(u); const j = await r.json(); const D = j.daily;
    const trip = DAYS.map(d=>d.date); let idx = D.time.map((t,i)=>trip.includes(t)?i:-1).filter(i=>i>=0);
    let note = '';
    if (!idx.length) { idx = D.time.map((_,i)=>i).slice(0,7); note = `<div class="msg">여행일 예보는 8월 말부터 나와요. 지금 제주 날씨 ↓</div>`; }
    $wx.innerHTML = note + '<div class="row">' + idx.map(i => `<div class="d"><small>${D.time[i].slice(5).replace('-','/')}</small><div class="i">${WMO(D.weather_code[i])}</div><div class="t">${Math.round(D.temperature_2m_max[i])}° <small>/ ${Math.round(D.temperature_2m_min[i])}°</small></div><small>☔ ${D.precipitation_probability_max[i]}%</small></div>`).join('') + '</div>';
    localStorage.setItem('jeju-wx', $wx.innerHTML);
    planBAlert(idx.filter(i => trip.includes(D.time[i]) && D.precipitation_probability_max[i] >= 70).map(i => `${DAYS.find(d=>d.date===D.time[i]).label} ${D.precipitation_probability_max[i]}%`));
  } catch (e) { $wx.innerHTML = localStorage.getItem('jeju-wx') || '<div class="msg">날씨 정보를 불러올 수 없어요 (오프라인?)</div>'; }
})();

// ===== 오프라인 / PWA =====
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (!matchMedia('(display-mode: standalone)').matches && !navigator.standalone) document.getElementById('install').style.display = 'block';

</script>
</body>
